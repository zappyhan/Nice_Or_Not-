[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reputation-early-warning"
version = "0.1.0"
description = "Restaurant reputation early-warning system built on the Yelp Open Dataset"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard ships inside the package, so a wheel install still serves it.
[tool.setuptools.package-data]
"reputation.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning"]
